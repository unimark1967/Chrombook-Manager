<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Устройството е заключено</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        'Helvetica Neue', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 48px 32px;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }

    .icon-wrap {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #475569;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.3); }
      50%       { box-shadow: 0 0 0 20px rgba(99, 102, 241, 0); }
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.3px;
    }

    .message {
      font-size: 16px;
      color: #94a3b8;
      line-height: 1.6;
      min-height: 48px;
      padding: 0 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 13px;
      color: #64748b;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6366f1;
      animation: blink 1.4s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    footer {
      position: fixed;
      bottom: 24px;
      font-size: 12px;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrap">
      <!-- Lock SVG icon -->
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
           stroke="#6366f1" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
      </svg>
    </div>

    <h1 class="title">Устройството е заключено</h1>

    <p class="message" id="teacher-message">
      Изчакайте инструкции от учителя.
    </p>

    <div class="badge">
      <span class="badge-dot"></span>
      Chromebook Manager
    </div>
  </div>

  <footer>© Chromebook Manager</footer>

  <script>
    // Read the message from the URL query param
    const params = new URLSearchParams(window.location.search);
    const msg = params.get('message');
    if (msg) {
      document.getElementById('teacher-message').textContent = msg;
    }

    // Prevent navigation away from this page
    window.addEventListener('beforeunload', (e) => {
      e.preventDefault();
      e.returnValue = '';
    });

    // Listen for unlock messages
    chrome.runtime.onMessage.addListener((msg) => {
      if (msg.type === 'UNLOCK') {
        window.close();
      }
    });
  </script>
</body>
</html>
